# ============================================================
# NetworkPolicies — Namespace Application ({{ .Values.namespace }})
# ============================================================

# 1. Défaut : Isolation totale Ingress et Egress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
# 2. DNS Egress (Restreint exclusivement au namespace kube-system / CoreDNS)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# 3. Base de données PostgreSQL
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-policy
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.studentService.name }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.teacherAdminService.name }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.enrollmentService.name }}
      ports:
        - protocol: TCP
          port: {{ .Values.postgres.port }}

---
# 4. Frontend (Reçoit le trafic Traefik, communique vers les microservices backend)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-policy
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.frontend.name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: {{ .Values.frontend.port }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.studentService.name }}
      ports:
        - protocol: TCP
          port: {{ .Values.studentService.port }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.teacherAdminService.name }}
      ports:
        - protocol: TCP
          port: {{ .Values.teacherAdminService.port }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.enrollmentService.name }}
      ports:
        - protocol: TCP
          port: {{ .Values.enrollmentService.port }}

---
# 5. Student Service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: student-service-policy
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.studentService.name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Trafic applicatif interne
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.frontend.name }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.enrollmentService.name }}
      ports:
        - protocol: TCP
          port: {{ .Values.studentService.port }}
    # Scrape Prometheus inter-namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.monitoringNamespace | default "monitoring" }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: {{ .Values.studentService.port }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: {{ .Values.postgres.port }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.teacherAdminService.name }}
      ports:
        - protocol: TCP
          port: {{ .Values.teacherAdminService.port }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.enrollmentService.name }}
      ports:
        - protocol: TCP
          port: {{ .Values.enrollmentService.port }}
    # Envoi des traces OTLP vers le Collector (cross-namespace)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.monitoringNamespace | default "monitoring" }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318

