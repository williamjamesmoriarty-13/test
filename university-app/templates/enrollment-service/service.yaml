apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.enrollmentService.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.enrollmentService.name }}
    app.kubernetes.io/part-of: university-app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Values.enrollmentService.name }}
  ports:
    - port: {{ .Values.enrollmentService.port }}
      targetPort: {{ .Values.enrollmentService.port }}
