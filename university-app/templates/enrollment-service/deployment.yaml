apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.enrollmentService.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.enrollmentService.name }}
    app.kubernetes.io/part-of: university-app
    app.kubernetes.io/version: {{ .Values.image.tag | quote }}
spec:
  replicas: {{ .Values.enrollmentService.replicas.min }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.enrollmentService.name }}
  template:
    metadata:
      annotations:
        instrumentation.opentelemetry.io/inject-python: "true"
      labels:
        app.kubernetes.io/name: {{ .Values.enrollmentService.name }}
        app.kubernetes.io/part-of: university-app
        app.kubernetes.io/version: {{ .Values.image.tag | quote }}
    spec:
      containers:
        - name: {{ .Values.enrollmentService.name }}
          image: "{{ .Values.image.registry }}/{{ .Values.enrollmentService.image }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.enrollmentService.port }}
          env:
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: ENROLLMENT_DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: ENROLLMENT_DB_PASSWORD } }
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_DB } }
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: {{ .Values.postgres.port | quote }}
            - name: DB_SCHEMA
              value: {{ .Values.enrollmentService.env.dbSchema | quote }}
            - name: STUDENT_SERVICE_URL
              value: "http://{{ .Values.studentService.name }}:{{ .Values.studentService.port }}"
            - name: TEACHER_ADMIN_SERVICE_URL
              value: "http://{{ .Values.teacherAdminService.name }}:{{ .Values.teacherAdminService.port }}"
            - name: HTTP_TIMEOUT_SECONDS
              value: {{ .Values.enrollmentService.env.httpTimeoutSeconds | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.enrollmentService.env.logLevel | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.monitoring.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_SERVICE_NAME
              value: "{{ .Values.enrollmentService.name }}"
          resources:
            {{- toYaml .Values.enrollmentService.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.enrollmentService.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.enrollmentService.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}